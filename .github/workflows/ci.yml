name: Docker CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Build and integration check
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start application
        run: docker compose up -d --no-build

      - name: Wait for backend API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:3000/api/articles > /tmp/articles.json; then
              echo "Backend is responding"
              cat /tmp/articles.json
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become ready"
          exit 1

      - name: Verify frontend HTTP response
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:4200/ -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html

      - name: Verify API through Nginx
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            http://127.0.0.1:4200/api/articles -o /tmp/nginx-api.json
          grep -q '"articles"' /tmp/nginx-api.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans


  publish:
    name: Publish Docker images to GHCR
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image names
        id: images
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.repository }}-backend:latest
            ghcr.io/${{ steps.images.outputs.repository }}-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.repository }}-frontend:latest
            ghcr.io/${{ steps.images.outputs.repository }}-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
