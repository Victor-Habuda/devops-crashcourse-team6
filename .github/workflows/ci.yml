name: Docker CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Build and integration check
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start application
        run: docker compose up -d --no-build

      - name: Wait for backend API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:3000/api/articles > /tmp/articles.json; then
              echo "Backend is responding"
              cat /tmp/articles.json
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become ready"
          exit 1

      - name: Verify frontend HTTP response
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:4200/ -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html

      - name: Verify API through Nginx
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            http://127.0.0.1:4200/api/articles -o /tmp/nginx-api.json
          grep -q '"articles"' /tmp/nginx-api.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
